name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.12 is the floor: bpmnlint CommonJS-requires an ESM-only min-dash,
        # which only resolves where require(esm) is enabled. See docs/FINDINGS.md F6.
        node: ['22.12', '22', '24']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  licence-guard:
    name: licence guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The bpmn.io licence is not OSI-approved: it requires a visible watermark on
      # rendered diagrams. Keeping the core free of those four packages is the whole
      # enterprise-procurement argument, so it is enforced, not trusted. See ADR-009.
      - name: no watermark-licensed packages in the dependency tree
        run: |
          set -e
          found=0
          for pkg in bpmn-js dmn-js form-js cmmn-js; do
            if [ -d "node_modules/$pkg" ]; then
              echo "::error::$pkg is present in the dependency tree. It carries the"
              echo "::error::bpmn.io watermark licence and must not appear in the core."
              found=1
            fi
          done
          exit $found

  corpus-integrity:
    name: corpus integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Every reference model must still parse and validate. If this breaks, either a
      # dependency regressed or a fixture was modified in place — both are serious.
      - run: node bench/scorer/baseline.mjs bench/corpus
